# VITmate knowledge base.
#
# One entry per intent. The intent classifier decides WHAT the user is asking
# about; this file supplies WHAT VITmate says. Edit this file to update answers;
# no retraining is required.
#
# Fields
#   title           short topic name, also used to resolve follow-ups ("how does it work?")
#   summary         first answer for the intent (Markdown, rendered safely by the UI)
#   details         shown when the user follows up on the same topic
#   sources         official pages the facts were taken from
#   time_sensitive  true => the answer carries a "verify the latest official info" note
#   last_verified   date the facts were checked against the sources
#
# All VIT facts were collected from official VIT websites (vit.ac.in,
# viteee.vit.ac.in, vtop.vit.ac.in) on 2026-09-24. Nothing here is live data.

meta:
  retrieved_on: "2026-09-24"
  official_site: https://vit.ac.in/

# Suggested prompts shown on a new chat. The backend only serves those whose
# question the trained model actually classifies as the listed intent.
starter_questions:
  - {intent: ffcs, question: "What is FFCS?"}
  - {intent: hostel, question: "What are the hostel facilities?"}
  - {intent: placements, question: "How can I learn about VIT placements?"}
  - {intent: admissions, question: "Tell me about VIT admissions."}
  - {intent: library, question: "What facilities does the library provide?"}
  - {intent: student_welfare, question: "What student services are available?"}
  - {intent: examinations, question: "How does grading work at VIT?"}
  - {intent: attendance, question: "What is the attendance requirement?"}

responses:
  # ------------------------------------------------------------------ general
  greeting:
    - "Hi! I'm **VITmate** 👋 — your VIT Campus Companion. How can I help you today?"
    - "Hello! I'm **VITmate**. Ask me anything about VIT — FFCS, hostels, admissions, placements and more."
    - "Hey there! **VITmate** here. What would you like to know about VIT?"
  goodbye:
    - "Goodbye! Good luck with everything at VIT. 👋"
    - "See you soon! Come back whenever you have a question about VIT."
    - "Take care! I'm here whenever you need VIT information."
  thanks:
    - "You're welcome! Anything else you'd like to know about VIT?"
    - "Glad I could help! Feel free to ask another question."
    - "Happy to help. 😊 Is there anything else about VIT I can explain?"
  profanity:
    - "Let's keep things respectful. I'm happy to help with any question about VIT."
  out_of_scope:
    - "I'm designed to help with VIT-related academic and campus questions, so I can't answer that one. Try asking about FFCS, hostels, admissions, exams or placements."
    - "That's outside what I know — I only cover VIT topics like academics, campus life, admissions and careers. What would you like to know about VIT?"
  low_confidence:
    - "I'm not confident I understood that. Could you rephrase your question about VIT?"
  clarify_follow_up:
    - "Could you tell me which VIT topic you mean? For example: FFCS, hostels, admissions or placements."
  unavailable:
    - "Sorry, I don't have verified information on that topic yet. Please check the official VIT website: https://vit.ac.in/"

entries:
  bot_identity:
    title: VITmate
    summary: |
      I'm **VITmate — Your VIT Campus Companion**, a voice- and text-enabled assistant for VIT questions.

      A deep-learning intent classifier (a fine-tuned transformer) works out what you are asking about, and I answer from a knowledge base built from official VIT web pages. I'm a student lab project by **B. Jaison Edward (Reg. No. 23BAI0094)**, not an official VIT service.
    details: |
      How I work:
      - Your typed or spoken question (speech is transcribed in your browser) is sent to my backend.
      - A fine-tuned transformer model classifies it into one of 36 intents.
      - I reply with information stored in a curated knowledge base of official VIT sources, so I don't make up facts.
    sources: []
    time_sensitive: false

  capabilities:
    title: what I can help with
    summary: |
      I can answer questions about VIT, including:
      - **Academics** — FFCS, programmes, schools, exams (CAT/FAT), grading, attendance, academic calendar
      - **Admissions** — application process, VITEEE, eligibility, fees, scholarships
      - **Campus life** — hostels, mess and food, library, sports, health centre, transport, facilities
      - **Student life** — clubs, Riviera and graVITas, VTOP, counselling, anti-ragging, grievances
      - **Careers** — placements, the Career Development Centre and internships

      You can type your question or switch to **Speak** and ask out loud.
    details: |
      Try questions like "What is FFCS?", "What are the hostel facilities?", "How does grading work?" or "Tell me about VIT placements". My information comes from official VIT pages collected in September 2026, so always confirm time-sensitive details on https://vit.ac.in/.
    sources: []
    time_sensitive: false

  # ---------------------------------------------------------------- about VIT
  about_vit:
    title: VIT
    summary: |
      **Vellore Institute of Technology (VIT)** was founded in **1984** as Vellore Engineering College, a self-financing institution. It was granted **university status in 2001** (deemed to be university under Section 3 of the UGC Act, 1956).

      - **Founder & Chancellor:** Dr. G. Viswanathan
      - **Campuses:** VIT Vellore, VIT Chennai, VIT-AP and VIT-Bhopal
      - The Vellore campus covers **372 acres**
      - VIT Vellore is accredited by NAAC with an **A++** grade (Cycle 4, CGPA 3.66)
    details: |
      More about VIT:
      - **Vice-Chancellor:** Dr. V. S. Kanchana Bhaaskaran; **Pro-Vice Chancellor:** Dr. Partha Sharathi Mallick; **Registrar:** Dr. Jayabarathi T.
      - **Vice-Presidents:** Dr. Sankar Viswanathan, Dr. Sekar Viswanathan and Dr. G. V. Selvam.
      - Vellore and Chennai come under the deemed university; VIT-AP and VIT-Bhopal are state private universities.
      - VIT's official ranking page reports **14th in the NIRF 2025 University category**, and VIT has been in the NIRF top 20 universities every year since 2016.
      - B.Tech programmes hold ABET accreditation, and VIT is recognised as an Institute of Eminence.
    sources:
      - https://vit.ac.in/about-vit
      - https://vit.ac.in/about/leadership
      - https://vit.ac.in/ranking-and-recognition
      - https://vit.ac.in/vit-milestones
    time_sensitive: true
    last_verified: "2026-09-24"

  campus_location:
