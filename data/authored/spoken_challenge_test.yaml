# Held-out "spoken-style" challenge test set.
# Written independently of the training utterances to imitate transcripts
# produced by browser speech recognition (fillers, run-on phrasing, no
# punctuation, casual grammar). NEVER used for training or model selection;
# build_dataset.py removes any training utterance that collides with these.
greeting:
  - hey hello how are you today
  - hi good morning to you
  - hello hello is this thing working
goodbye:
  - okay I think that's it for today bye
  - alright thank you bye bye
  - ok I'm going now see you later
thanks:
  - oh okay thank you very much that was useful
  - great that's exactly what I wanted thanks
  - okay thank you
