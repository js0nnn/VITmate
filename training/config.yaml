# Hyperparameters of the deployed VITmate intent model.
# model_name was selected by mean validation macro-F1 over 3 seeds (docs/results/model_comparison.md).
# Dataset v1 selected bge-small; dataset v2 (38 intents) selected DistilBERT (0.8951 vs 0.8876).
model_name: distilbert-base-uncased
learning_rate: 5.0e-5
batch_size: 16
max_epochs: 25
patience: 4
warmup_ratio: 0.1
weight_decay: 0.01
max_length: 64
seed: 42
save_fp16: true
